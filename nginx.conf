server {
    listen 80;
    server_name pods2.jphartogi.com _;

    client_max_body_size 30m;  # a little above the app's 25MB upload limit

    # Let's Encrypt's HTTP-01 challenge: certbot drops a token file here, and it
    # must be reachable over plain HTTP (before any certificate exists yet, and
    # again on every renewal) - so this needs to stay outside any HTTPS redirect.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        proxy_pass http://app:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
