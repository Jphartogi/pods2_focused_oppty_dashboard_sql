server {
    listen 80;
    server_name pods2.jphartogi.com _;

    # Let's Encrypt's HTTP-01 challenge: certbot drops a token file here, and it
    # must be reachable over plain HTTP (before any certificate exists yet, and
    # again on every renewal) - so this needs to stay outside the HTTPS redirect.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name pods2.jphartogi.com;

    ssl_certificate     /etc/letsencrypt/live/pods2.jphartogi.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/pods2.jphartogi.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    client_max_body_size 30m;  # a little above the app's 25MB upload limit

    location / {
        proxy_pass http://app:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
